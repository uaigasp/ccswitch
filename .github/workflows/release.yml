name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: build
        run: GOOS=windows GOARCH=amd64 go build -o ccswitch.exe ./cmd/ccswitch

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: ccswitch.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
